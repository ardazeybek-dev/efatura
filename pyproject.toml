[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "efatura-tr"
dynamic = ["version"]
description = "Read Turkish e-Fatura / e-Arşiv (UBL-TR) invoice XML into typed Python objects, JSON or CSV, and check that the totals add up."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Arda Zeybek", email = "179981861+ardazeybek-dev@users.noreply.github.com" },
]
keywords = ["turkish", "e-fatura", "e-arsiv", "ubl", "ubl-tr", "invoice", "gib", "kdv", "tevkifat", "xml"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Natural Language :: Turkish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Text Processing :: Markup :: XML",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/ardazeybek-dev/efatura"
Repository = "https://github.com/ardazeybek-dev/efatura"
Issues = "https://github.com/ardazeybek-dev/efatura/issues"

[project.scripts]
efatura-tr = "efatura_tr.cli:main"

[tool.hatch.version]
path = "src/efatura_tr/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/efatura_tr"]

[tool.hatch.build.targets.sdist]
include = ["src/efatura_tr", "tests", "scripts", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
exclude = ["*.md", "src/efatura_tr/_codelists.py"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["tests"]
addopts = "-q --doctest-modules --import-mode=importlib"
